#
# Cross-platform build + test gate. Proves the portable half of zerobas builds and
# passes its tests with only pasmo + python3 -- no openMSX and no proprietary
# reference ROMs.
#
# What runs (per OS):
#   * the ROMs (build/basic.rom, build/disk.rom) -- pasmo assembles them.
#   * make unit-test -- the emulator-free Z80 unit tests (tests/): an embedded Z80
#     core, no openMSX, no reference ROMs. The portable regression layer.
#   * a smoke import of the host tooling, so the build scripts are checked to load.
#   * make audit-citations -- the clean-room mechanical floor (0.27 s, pure python3,
#     read-only). It is here because "run it on demand" left it RED for 268 of its
#     first 761 commits; see docs/spec-audit-citations-gate.md.
#
# What does NOT run: the .ips/.bps patch build (needs a stock C-BIOS main ROM to
# stamp against -- see tools/build_patches.py) and the openMSX oracle probes (need
# your own reference ROMs). Those are validated locally.
#
# Scope: Linux + Windows. macOS is built locally by the author (and the hosted macOS
# runners bill at 10x on a private repo), so it is not a CI job; its toolchain is
# nonetheless verified (pasmo 0.5.5 builds from source on macOS).
#
# Windows runs inside MSYS2 so the existing Unix-style Makefile (mkdir -p, cp, rm,
# python3) works unchanged; pasmo has no Windows package, so it is built from source
# in the same environment. The repo-wide .gitattributes forces LF endings so the
# Windows runner's autocrlf does not break the Makefile.

name: ci

# 🌐 ON EVERY PUSH TO main AND EVERY PULL REQUEST since 2026-10-13: the repo is
# public, so standard runners are free (the block below said to switch this on
# then). It was manual-trigger only while the repo was PRIVATE, when Actions
# minutes were metered (and the Windows runner billed at 2x).
#
# Run it from the Actions tab ("Run workflow"), picking the target, or:
#     gh workflow run ci.yml -f target=windows
# (the workflow must be on the default branch for the trigger to appear; you can
# then choose any branch as the ref).
#
# WHEN THE REPO GOES PUBLIC, standard-runner minutes become free -- uncomment the
# push/pull_request block below to get automatic CI on every change.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which target(s) to build + test"
        type: choice
        default: both
        options: [both, linux, windows]
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    # On manual dispatch, honour the target selection; on any auto-trigger
    # (push/PR, once enabled), always run.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'both' || inputs.target == 'linux' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # The DISTRIBUTION's pasmo (0.5.3) on purpose (D-PASMO053): it is what
      # testers get from apt, so this job is the standing check that the sources
      # still assemble with it. The Windows job builds 0.5.5. The silent half --
      # 0.5.3 assembling an operand as 0 -- is `make alias-order-check`, run below.
      - name: Install pasmo (distribution 0.5.3)
        run: sudo apt-get update && sudo apt-get install -y pasmo

      - name: Show toolchain
        run: |
          pasmo 2>&1 | head -1 || true   # pasmo has no --version flag; bare run prints its banner
          python3 --version

      - name: Build the ROMs
        run: make basic-reloc   # build/basic.rom was retired 2026-07-29

      - name: Smoke-import host tooling
        run: |
          python3 tools/build_patches.py --help > /dev/null
          python3 tools/install-openmsx-machine.py --help > /dev/null
          python3 -c "import sys; sys.path.insert(0, 'tools'); import openmsx_paths; print('openmsx_paths OK')"

      - name: Clean-room mechanical floor
        run: make audit-citations

      - name: Run the emulator-free unit tests
        run: make unit-test

      - name: No equ pasmo 0.5.3 resolves as 0 (D-PASMO053)
        run: make alias-order-check

      - name: The openMSX package tool's selftest (IPS / BPS handling)
        run: python3 tools/make_dist.py --selftest

  windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'both' || inputs.target == 'windows' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}     # Unix shell so the Makefile recipes work unchanged
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MSYS       # most Linux-like env; all tools share one runtime
          update: false       # skip the slow full pacman -Syuu; pinned snapshot is fine
          # git: tools/check_citation_paths.py (run inside `make basic-reloc`)
          # asks git which files are tracked -- the first push-triggered run
          # (2026-10-13) failed here, as MSYS2 has no git of its own.
          install: >-
            make
            gcc
            python
            curl
            tar
            git

      # pasmo has no Windows package, so we build it from source -- but that is
      # deterministic for a fixed version, so cache the built binary and skip the
      # compile on a hit. Bump PASMO_VER (or the key) if the MSYS2 toolchain changes
      # in a way that breaks an old binary.
      - name: Cache built pasmo
        id: pasmo-cache
        uses: actions/cache@v4
        with:
          path: pasmo-bin
          key: pasmo-msys2-0.5.5-v1

      - name: Build pasmo from source (cache miss only)
        if: steps.pasmo-cache.outputs.cache-hit != 'true'
        run: |
          set -eux
          curl -fsSL https://pasmo.speccy.org/bin/pasmo-0.5.5.tar.gz -o pasmo.tar.gz
          tar xf pasmo.tar.gz
          cd pasmo-0.5.5
          ./configure
          make
          mkdir -p "$GITHUB_WORKSPACE/pasmo-bin"
          # autotools emits pasmo.exe on Windows; fall back to a bare name just in case
          cp pasmo.exe "$GITHUB_WORKSPACE/pasmo-bin/pasmo.exe" 2>/dev/null \
            || cp pasmo "$GITHUB_WORKSPACE/pasmo-bin/pasmo.exe"

      - name: Install pasmo on PATH
        run: |
          set -eux
          # /usr/bin always exists in the MSYS env and is on PATH; /usr/local/bin
          # does not exist by default (the earlier cp there failed).
          cp "$GITHUB_WORKSPACE/pasmo-bin/pasmo.exe" /usr/bin/pasmo.exe
          command -v pasmo
          # pasmo has no --version flag; running it bare prints its banner (and exits
          # nonzero), which both shows the version and proves the binary executes.
          pasmo 2>&1 | head -1 || true

      - name: Show toolchain
        run: |
          python3 --version
          make --version | head -1

      - name: Let MSYS2's git read the checkout
        run: git config --global --add safe.directory "$(pwd)"

      - name: Build the ROMs
        run: make basic-reloc   # build/basic.rom was retired 2026-07-29

      - name: Smoke-import host tooling
        run: |
          python3 tools/build_patches.py --help > /dev/null
          python3 tools/install-openmsx-machine.py --help > /dev/null
          python3 -c "import sys; sys.path.insert(0, 'tools'); import openmsx_paths; print('openmsx_paths OK')"

      - name: Clean-room mechanical floor
        run: make audit-citations

      - name: Run the emulator-free unit tests
        run: make unit-test

  # 📦 THE openMSX DOWNLOAD (Joost, 2026-10-13: "the primary use is with openMSX",
  # shipping "the ready made Rom"). Every push to main that passes the Linux job
  # rebuilds build/zerobas-openmsx.zip (tools/make_dist.py: the gated machine
  # definition, ROMs by relative path) and replaces it on the rolling `nightly`
  # pre-release. The main ROM needs C-BIOS at the PINNED revision
  # (tools/build_repacked_cbios.py PINNED_TAG); its logo ROM comes from the same
  # build, as there is no openMSX here. ⚠️ What "nightly" vouches for is what
  # this workflow runs -- the build and the unit tests. The differential battery
  # against the reference machines needs proprietary ROMs and runs locally.
  nightly:
    needs: linux
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: nightly
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install pasmo
        run: sudo apt-get update && sudo apt-get install -y pasmo

      - name: C-BIOS at the pinned revision
        run: |
          git clone -q https://github.com/cbios/cbios.git ../cbios
          rev=$(python3 -c "import sys; sys.path.insert(0, 'tools'); import build_repacked_cbios as b; print(b.PINNED_TAG)")
          git -C ../cbios checkout -q "$rev"
          make -C ../cbios derived/bin/cbios_logo_msx1.rom

      - name: Build the ROMs and the openMSX package
        run: |
          make all disk/test720.dsk
          make build/zerobas-main-eu.rom CBIOS=../cbios
          python3 tools/make_dist.py --logo ../cbios/derived/bin/cbios_logo_msx1.rom

      - name: The shipped patch matches this build
        run: git diff --exit-code -- zerobas-main-eu.ips zerobas-main-eu.bps

      - name: Publish to the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f nightly "$GITHUB_SHA"
          git push -f origin refs/tags/nightly
          notes="Built from ${GITHUB_SHA::8} on $(date -u +%Y-%m-%d). Unzip zerobas-openmsx.zip into openMSX's user folder and pick the zerobas_MSX1 machine -- see QUICKSTART.md. This build passed the unit tests on GitHub; the comparison with real MSX machines runs on the developers' computers."
          if gh release view nightly > /dev/null 2>&1; then
            gh release edit nightly --prerelease --title "Nightly build" --notes "$notes"
          else
            gh release create nightly --prerelease --title "Nightly build" --notes "$notes"
          fi
          gh release upload nightly build/zerobas-openmsx.zip --clobber
